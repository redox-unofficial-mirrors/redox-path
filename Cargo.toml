[package]
name = "redox-path"
version = "0.4.1"
edition = "2021"
description = "Path parsing primitives for Redox"
license = "MIT"

[dependencies.simdutf8]
version = "0.1.5"
optional = true
default-features = false

[dependencies.memchr]
version = "2.8.3"
optional = true
default-features = false

[features]
default = []
simd = ["simdutf8", "memchr"]
